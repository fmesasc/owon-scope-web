name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test   # nothing is published unless all tests pass
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir _site
          cp owonscope/web/* _site/
          cp udev/99-owon.rules llms.txt _site/
          { cat llms.txt; printf '\n\n---\n\n'; cat README.md; } > _site/llms-full.txt
          # Cache busting: GitHub Pages lets browsers keep files for 10 minutes, so give
          # every deploy its own module URLs (an old app.js could still be running otherwise).
          V="${GITHUB_SHA::8}"
          sed -i -E "s#(from \"\./[a-z]+\.js)\"#\1?v=$V\"#g" _site/*.js
          sed -i -E "s#href=\"style\.css\"#href=\"style.css?v=$V\"#; s#src=\"app\.js\"#src=\"app.js?v=$V\"#; s#__BUILD__#$V#g" _site/index.html
          grep -q "app.js?v=$V" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
